<div class="h-100 w-100 d-flex flex-column">

    <div class="card shadow-sm header">

        <div class="card-header bg-primary text-white flex-shrink-0 d-flex justify-content-between align-items-center">
            <h5 class="mb-0">
                <i class="bi bi-tools me-2"></i>
                Accessory Entry
            </h5>

            <app-employee-filter [(filter)]="filter" [disabled]="isEditing"></app-employee-filter>
        </div>

        <div class="card-body d-flex flex-column">

            <div class="d-flex align-items-center gap-2 mb-4 flex-shrink-0">
                <label for="workingMonthInput" class="form-label fw-bold mb-0">
                    Working Month
                    <span class="text-danger">*</span>
                </label>

                <input id="workingMonthInput" type="month" class="form-control form-control-sm w-auto"
                    [(ngModel)]="selectedMonth" (change)="onMonthChange()" [disabled]="isEditing">

                <button type="button" class="btn btn-primary btn-sm" (click)="addAccessoryEntryRow()"
                    [disabled]="isEditing">
                    <i class="bi bi-plus-lg me-1"></i>
                    Add Row
                </button>

                <button type="button" class="btn btn-outline-primary btn-sm" (click)="excelFileInput.click()"
                    [disabled]="isEditing">
                    <i class="bi bi-file-earmark-excel me-1"></i>
                    Import Excel
                </button>
                <label id="labelFileInput" for="excelFileInput" [hidden]="true"> Hidden</label>
                <input id="excelFileInput" #excelFileInput type="file" class="d-none" accept=".xlsx,.xls"
                    (change)="onExcelFileSelected($event)">
            </div>

            <form [formGroup]="form" (ngSubmit)="saveAccessoryEntry()"
                class="d-flex flex-column flex-grow-1 min-h-0 h-100">

                <div formArrayName="accessoryEntries" class="content d-flex flex-column flex-grow-1 min-h-0">

                    <div #accessoryTableContainer class="table-responsive accessory-table-container">
                        <table class="table table-bordered table-sm table-hover excel-like-table mb-0">

                            <thead class="table-light">
                                <tr>
                                    <th class="excel-header">SR NO</th>
                                    <th class="excel-header text-center">Action</th>
                                    <th class="excel-header" *ngFor="let field of fields; trackBy: trackByField"
                                        [hidden]="field.hidden">{{
                                        field.label }}</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr #accessoryEntryRow *ngFor="
                    let entry of accessoryEntries.controls;
                    let i = index;
                    trackBy: trackByControl
                  " [formGroupName]="i" [hidden]="!isRowVisible(i, entry)">

                                    <td class="excel-cell text-center align-middle">
                                        {{ i + 1 }}
                                    </td>

                                    <td class="text-center text-nowrap">
                                        <ng-container *ngIf="editingIndex === i; else viewActions">
                                            <button type="button" id="btnSaveRow_{{ i }}"
                                                class="btn btn-success btn-sm me-1" title="Save row"
                                                (click)="saveAccessoryEntryRow(i)">
                                                <i class="bi bi-check-lg"></i>
                                            </button>
                                            <button type="button" id="btnCancelRow_{{ i }}"
                                                class="btn btn-outline-secondary btn-sm" title="Cancel"
                                                (click)="cancelAccessoryEntryRow(i)">
                                                <i class="bi bi-arrow-counterclockwise"></i>
                                            </button>
                                        </ng-container>

                                        <ng-template #viewActions>
                                            <button type="button" id="btnEdit_{{ i }}"
                                                class="btn btn-outline-primary btn-sm me-1" title="Edit row"
                                                (click)="editAccessoryEntryRow(i)" [disabled]="isEditing">
                                                <i class="bi bi-pencil"></i>
                                            </button>
                                            <button type="button" id="btnRemove_{{ i }}" class="btn btn-danger btn-sm"
                                                title="Remove row" (click)="removeAccessoryEntryRow(i)"
                                                [disabled]="isEditing">
                                                <i class="bi bi-x-lg"></i>
                                            </button>
                                        </ng-template>
                                    </td>

                                    <td *ngFor="let field of fields; trackBy: trackByField" [hidden]="field.hidden">
                                        <input [type]="field.inputType" id="{{ field.key }}_{{ i }}"
                                            class="form-control excel-cell" [formControlName]="field.key">
                                    </td>
                                </tr>

                                <tr *ngIf="!hasVisibleRows()">
                                    <td [attr.colspan]="fields.length + 2" class="text-center text-muted py-4">
                                        No accessory entries available.
                                    </td>
                                </tr>
                            </tbody>

                        </table>

                    </div>
                </div>
            </form>

            <app-confirm-modal title="Remove Row"
                [message]="'Are you sure you want to remove row ' + ((pendingRemoveIndex ?? 0) + 1) + '?'"
                [visible]="pendingRemoveIndex !== null" (confirmed)="confirmRemoveAccessoryEntryRow()"
                (closed)="pendingRemoveIndex = null">
            </app-confirm-modal>
        </div>
    </div>
</div>
